name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"] # Task 1'deki yaml dosyanın tam 'name' değeri olmalı
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Pull Latest Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django
        shell: pwsh

      - name: Kill previously running instance
        continue-on-error: true
        run: |
          $tcpConnections = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
          if ($tcpConnections) {
              foreach ($conn in $tcpConnections) {
                  Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue
              }
          }
        shell: pwsh

      - name: Launch new version in background
        run: |
          Start-Process -FilePath "python" -ArgumentList "manage.py runserver" -WindowStyle Hidden
        shell: pwsh