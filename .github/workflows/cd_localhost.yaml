name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Pull Latest Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django
        shell: powershell

      - name: Kill previously running instance
        continue-on-error: true
        run: |
          Unregister-ScheduledTask -TaskName "DjangoServer" -Confirm:$false -ErrorAction SilentlyContinue
          $tcpConnections = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
          if ($tcpConnections) {
              foreach ($conn in $tcpConnections) {
                  Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue
              }
          }
          Start-Sleep -Seconds 2
        shell: powershell

      - name: Launch new version in background
        run: |
          $action = New-ScheduledTaskAction -Execute "python" `
            -Argument "manage.py runserver 0.0.0.0:8000" `
            -WorkingDirectory $env:GITHUB_WORKSPACE

          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(3)

          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask -TaskName "DjangoServer" `
            -Action $action `
            -Trigger $trigger `
            -Settings $settings `
            -Force

          Write-Host "Django sunucusu Task Scheduler ile baslatildi."
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
        shell: powershell